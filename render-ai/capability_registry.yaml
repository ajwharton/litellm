# render.ai capability registry — governed artifact (LiteLLM model groups)
# Direct provider mapping — no OpenRouter. Edit targets here; prompts use #pragma only.
#
# Start proxy:
#   litellm --config render-ai/capability_registry.yaml --port 4000
#
# Env (see .env.example): ANTHROPIC_API_KEY, OPENAI_API_KEY, MOONSHOT_API_KEY, XAI_API_KEY

# Capability → provider mapping (Andrew's keys, 2026-06)
# ┌─────────────────────┬──────────────────────────────────────────────────────────┐
# │ Capability          │ Providers (try order → fallbacks in router_settings)    │
# ├─────────────────────┼──────────────────────────────────────────────────────────┤
# │ high-reasoning      │ Kimi K2.6 → Claude Sonnet 4.5 → Grok fast-reasoning   │
# │ high-coding         │ Kimi K2.6 → Claude Sonnet 4.5 → GPT-4.1 mini            │
# │ cheap-deterministic │ Grok 3 mini → GPT-5 mini → Grok 4.1 fast (non-reason)  │
# │ multimodal          │ Kimi K2.6 → Grok 2 vision → Claude Sonnet 4.5           │
# └─────────────────────┴──────────────────────────────────────────────────────────┘

model_list:
  # high-reasoning — INDEX / PLAN / ambiguous RCA
  - model_name: high-reasoning
    litellm_params:
      model: moonshot/kimi-k2.6
      api_key: os.environ/MOONSHOT_API_KEY
  - model_name: high-reasoning
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: high-reasoning
    litellm_params:
      model: xai/grok-4-1-fast-reasoning
      api_key: os.environ/XAI_API_KEY

  # high-coding — fenced IMPLEMENT
  - model_name: high-coding
    litellm_params:
      model: moonshot/kimi-k2.6
      api_key: os.environ/MOONSHOT_API_KEY
  - model_name: high-coding
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: high-coding
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY

  # cheap-deterministic — mechanical / doc passes (eval before high-stakes use)
  - model_name: cheap-deterministic
    litellm_params:
      model: xai/grok-3-mini
      api_key: os.environ/XAI_API_KEY
  - model_name: cheap-deterministic
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: cheap-deterministic
    litellm_params:
      model: xai/grok-4-1-fast-non-reasoning
      api_key: os.environ/XAI_API_KEY

  # multimodal — screenshot / diagram ingest
  - model_name: multimodal
    litellm_params:
      model: moonshot/kimi-k2.6
      api_key: os.environ/MOONSHOT_API_KEY
  - model_name: multimodal
    litellm_params:
      model: xai/grok-2-vision-latest
      api_key: os.environ/XAI_API_KEY
  - model_name: multimodal
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY

  # passthrough — call a provider model directly by name (bypasses pragma groups)
  - model_name: openai/*
    litellm_params:
      model: openai/*
      api_key: os.environ/OPENAI_API_KEY
  - model_name: anthropic/*
    litellm_params:
      model: anthropic/*
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: moonshot/*
    litellm_params:
      model: moonshot/*
      api_key: os.environ/MOONSHOT_API_KEY
  - model_name: xai/*
    litellm_params:
      model: xai/*
      api_key: os.environ/XAI_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  fallbacks:
    - high-coding: ["high-reasoning"]
    - cheap-deterministic: ["high-coding", "high-reasoning"]
    - multimodal: ["high-reasoning"]

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600
  success_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY